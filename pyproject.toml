[project]
name = "birdman"
version = "0.1.0"
description = "Bird-identifier e-ink frame"
requires-python = ">=3.11"
dependencies = [
    "birdnet",
    "google-genai",
    "numpy",
    "pillow",
    "python-dotenv",
    "inky; sys_platform == 'linux'",
]

[project.scripts]
birdman-watch = "birdman.watch:main"
birdman-render = "birdman.render_once:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdman"]
